[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cocapn-tutor"
version = "3.0.0"
description = "FLUX v3.0 Tutor Personality Module — pedagogical layer on the agent-native VM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["flux", "vm", "agent", "tutor", "bytecode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
cocapn-tutor = "cocapn_tutor_flux:main"

[tool.hatch.build.targets.wheel]
packages = ["cocapn_tutor_flux.py"]
